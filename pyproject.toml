[build-system]

requires = [
    "setuptools>=45",
    "wheel",
    "setuptools_scm[toml]>=6.2",
]

build-backend = "setuptools.build_meta"

[project]
name = "solve123d"
dynamic = ["version"]
authors = [
    {name = "Dmytry Lavrov", email = "dmytryl@gmail.com"},
]
description = "A python library for CAD geometric constraints"
readme = "README.md"
requires-python = ">= 3.10, < 3.14"
keywords = [
    "3d models",
    "3d printing",
    "3d",    
    "cad",
    "cadquery",    
    "python",
]
license = {text = "Apache-2.0"}
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "jax",
    "jaxopt",
    "build123d"
]

[project.urls]
"Homepage" = "https://github.com/dmytry/solve123d"

[project.optional-dependencies]
# development dependencies
development = [
    "black",
    "mypy",
    "pylint",
    "pytest",
    "pytest-benchmark",
    "pytest-cov",
    "pytest-xdist",
    "wheel",
]

# dependencies to build the docs
docs = [
    "sphinx==8.1.3", # pin for stability of docs builds
    "sphinx-design",
    "sphinx-copybutton",
    "sphinx-hoverxref",
    "sphinx-rtd-theme",
    "sphinx_autodoc_typehints",
]

# all dependencies
all = [    
    "solve123d[development]",
    "solve123d[docs]"    
]
test = [
    "solve123d[development]"
]

[tool.setuptools.packages.find]
where = ["src"]
# exclude solve123d._dev from wheels
exclude = ["solve123d._dev"]

[tool.setuptools_scm]
write_to = "src/solve123d/_version.py"

[tool.black]
target-version = ["py310", "py311", "py312", "py313"]
line-length = 88

[tool.pytest.ini_options]
addopts = "--cov=solve123d --cov-report=term-missing"

[tool.tox]
requires = ["tox>=4.19"]
env_list = ["3.13", "3.12", "type"]

[tool.tox.env_run_base]
allowlist_externals = ["pytest"]
description = "Run test under {base_python}"
commands = [["pytest"]]
# commands = [["python", "-m", "pytest"]]

[tool.tox.env.type]
description = "run type check on code base"
deps = ["mypy==1.11.2", "types-cachetools>=5.5.0.20240820", "types-chardet>=5.0.4.6"]
commands = [["mypy", "src{/}tox"], ["mypy", "tests"]]
